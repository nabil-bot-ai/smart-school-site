<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل تطبيق Smart-School DZ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f4f7f6; color: #1a305e; }
        .container { padding: 50px 20px; }
        .logo { width: 120px; border-radius: 20px; }
        h1 { color: #1a305e; font-size: 2.5rem; }
        .download-btn {
            display: inline-block;
            padding: 15px 40px;
            background-color: #1a305e;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(26, 48, 94, 0.3);
            transition: 0.3s;
        }
        .download-btn:hover { background-color: #2a4a8e; transform: translateY(-3px); }
        .info { margin-top: 30px; font-size: 0.9rem; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <img src="icon.png" alt="Smart-School Logo" class="logo">

        <p>عش تجربة الـ E-BAC والـ E-BEM الحقيقية بالذكاء الاصطناعي</p>
        
        <a href="app-release.apk" class="download-btn">تحميل التطبيق (APK)</a>
        
        <div class="info">
            <p>* نسخة الأندرويد 1.0.0 | حجم الملف: 25MB</p>
            <p>بعد التحميل، قم بتفعيل "التثبيت من مصادر غير معروفة" في إعدادات هاتفك.</p>
        </div>

</body>
</html>
